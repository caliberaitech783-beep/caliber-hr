# Deploys the HR API (HR-Pulse-Full-Project/server) to Azure App Service hr-api-cmll-783.
# Login uses the user-assigned identity that Azure Deployment Center created (federated credentials, no stored password).

name: Build and deploy Node.js app to Azure Web App - hr-api-cmll-783

on:
  push:
    branches: [main]
    paths:
      - 'HR-Pulse-Full-Project/server/**'
      - '.github/workflows/main_hr-api-cmll-783.yml'
  workflow_dispatch:

concurrency:
  group: hr-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: HR-Pulse-Full-Project/server/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: HR-Pulse-Full-Project/server
        run: pnpm install --frozen-lockfile
      - name: Test API
        working-directory: HR-Pulse-Full-Project/server
        run: node --test app.test.mjs security.test.mjs joining-hierarchy.test.mjs telegram.test.mjs leave-approval.test.mjs attendance.test.mjs
      - name: Prepare deployment package
        working-directory: HR-Pulse-Full-Project/server
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile --prod --node-linker=hoisted
          rm -f bootstrap.mjs *.test.mjs
          printf '{"commit":"%s","host":"azure-app-service"}\n' "$GITHUB_SHA" > release.json
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: HR-Pulse-Full-Project/server
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C37CE79234A847D19AFDD5701BFE3EA7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9846DF1DEBB0406BB6F6FF1E2C39D1BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BF09CD4DD2E4E12A4E95F35F288B3F2 }}
      - name: Deploy to Azure Web App (zip deploy)
        id: deploy-to-webapp
        run: |
          set -e
          cd app && zip -qr ../app.zip . && cd ..
          app_id=$(az resource list --name hr-api-cmll-783 --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)
          test -n "$app_id"
          rg=$(echo "$app_id" | sed -E 's#.*/resourceGroups/([^/]+)/.*#\1#')
          # Restart first so a stuck Kudu/OneDeploy session does not block the upload.
          az webapp restart --ids "$app_id"
          sleep 20
          for attempt in 1 2 3; do
            if az webapp deploy --resource-group "$rg" --name hr-api-cmll-783 --src-path app.zip --type zip --clean true --restart true --timeout 600000; then exit 0; fi
            echo "Deploy attempt $attempt failed – retrying with Kudu zipdeploy"
            if az webapp deployment source config-zip --resource-group "$rg" --name hr-api-cmll-783 --src app.zip --timeout 600; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Check health
        run: |
          wait_for_release() {
            for i in $(seq 1 "$1"); do
              if curl -fsS --max-time 10 https://hr-api-cmll-783.azurewebsites.net/api/health |
                jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .release == $commit' > /dev/null; then
                echo "API is serving $GITHUB_SHA"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          if wait_for_release 6; then exit 0; fi
          echo "The App Service worker is still serving the previous release. Restarting the app once."
          app_id=$(az resource list --name hr-api-cmll-783 --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)
          test -n "$app_id"
          az webapp restart --ids "$app_id"
          wait_for_release 18
