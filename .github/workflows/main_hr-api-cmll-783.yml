# Deploys the HR API (HR-Pulse-Full-Project/server) to Azure App Service hr-api-cmll-783.
# Login uses the user-assigned identity that Azure Deployment Center created (federated credentials, no stored password).

name: Build and deploy Node.js app to Azure Web App - hr-api-cmll-783

on:
  push:
    branches: [main]
    paths:
      - 'HR-Pulse-Full-Project/server/**'
      - '.github/workflows/main_hr-api-cmll-783.yml'
  workflow_dispatch:

concurrency:
  group: hr-api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: HR-Pulse-Full-Project/server/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: HR-Pulse-Full-Project/server
        run: pnpm install --frozen-lockfile
      - name: Test API
        working-directory: HR-Pulse-Full-Project/server
        run: node --test app.test.mjs security.test.mjs joining-hierarchy.test.mjs telegram.test.mjs leave-approval.test.mjs attendance.test.mjs
      - name: Prepare deployment package
        working-directory: HR-Pulse-Full-Project/server
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile --prod --node-linker=hoisted
          rm -f bootstrap.mjs *.test.mjs
          printf '{"commit":"%s","host":"azure-app-service"}\n' "$GITHUB_SHA" > release.json
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: HR-Pulse-Full-Project/server
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C37CE79234A847D19AFDD5701BFE3EA7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9846DF1DEBB0406BB6F6FF1E2C39D1BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BF09CD4DD2E4E12A4E95F35F288B3F2 }}
      - name: Deploy to Azure Web App (zip deploy)
        id: deploy-to-webapp
        env:
          HR_API_APP: hr-api-cmll-783
          HR_API_RESOURCE_GROUP: coalmine-fleet-maintenance-rg
        run: |
          set -euo pipefail
          (cd app && zip -qr ../app.zip .)
          if ! app_state=$(az webapp show --resource-group "$HR_API_RESOURCE_GROUP" --name "$HR_API_APP" --query state -o tsv); then
            echo "::error::Azure could not read the production HR App Service through its deployment identity."
            exit 1
          fi
          if [ "$app_state" = "Stopped" ]; then
            if ! az webapp start --resource-group "$HR_API_RESOURCE_GROUP" --name "$HR_API_APP"; then
              echo "::error::Azure could not start the stopped HR App Service."
              exit 1
            fi
          fi
          # Submit the upload once. The health step below verifies startup and the deployed commit.
          if ! az webapp deploy --resource-group "$HR_API_RESOURCE_GROUP" --name "$HR_API_APP" \
            --src-path app.zip --type zip --restart true --async true --track-status false --enriched-errors true; then
            echo "::error::Azure could not submit the HR API package to Kudu. Check the deployment step log for the Azure error."
            exit 1
          fi
      - name: Check health
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 8 https://hr-api-cmll-783.azurewebsites.net/api/health |
              jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .release == $commit' > /dev/null; then
              echo "API is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Azure accepted the upload, but the HR API did not serve the new release within the health check window."
          exit 1
