name: Inspect HR API startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-api-startup-diagnostic.yml'

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C37CE79234A847D19AFDD5701BFE3EA7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9846DF1DEBB0406BB6F6FF1E2C39D1BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BF09CD4DD2E4E12A4E95F35F288B3F2 }}
      - name: Read App Service startup diagnostics
        run: |
          app=hr-api-cmll-783
          group=$(az resource list --name "$app" --resource-type Microsoft.Web/sites --query '[0].resourceGroup' -o tsv)
          test -n "$group"
          az webapp show -g "$group" -n "$app" --query '{state:state,availability:availabilityState}' -o json
          az webapp config show -g "$group" -n "$app" --query '{runtime:linuxFxVersion,alwaysOn:alwaysOn,healthCheckPath:healthCheckPath}' -o json
          startup=$(az webapp config show -g "$group" -n "$app" --query 'appCommandLine' -o tsv)
          case "$startup" in
            "") echo "Startup uses platform defaults" ;;
            *index.mjs*) echo "Startup command references index.mjs" ;;
            *npm*start*) echo "Startup uses npm start" ;;
            *) echo "Startup uses a custom command" ;;
          esac
          az webapp log deployment list -g "$group" -n "$app" --query '[0:3].{id:id,status:status,complete:complete}' -o json || true
          arm_token=$(az account get-access-token --query accessToken -o tsv)
          for path in release.json app.mjs index.mjs trial-joining.mjs; do
            file=$(mktemp)
            status=$(curl --max-time 10 -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $arm_token" "https://$app.scm.azurewebsites.net/api/vfs/site/wwwroot/$path" || true)
            echo "App Service package $path: HTTP $status"
            if [ "$status" = "200" ] && [ "$path" = "release.json" ]; then
              jq -r '.commit | select(test("^[a-f0-9]{40}$"))' "$file"
            fi
            if [ "$status" = "200" ] && [ "$path" = "app.mjs" ] && grep -q 'trial-employee' "$file"; then
              echo 'Installed app.mjs includes trial save'
            fi
          done
          unset arm_token
          log=$(mktemp)
          if az webapp log startup show -g "$group" -n "$app" > "$log" 2>/dev/null; then
            echo 'Latest startup log received'
          else
            zip=$(mktemp)
            az webapp log download -g "$group" -n "$app" --log-file "$zip" --only-show-errors || exit 1
            unzip -p "$zip" '*.log' > "$log" || true
          fi
          grep -Eaio "ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|Cannot find (module|package) '[^']+'|Missing required setting: (PGHOST|PGDATABASE|PGUSER)|ENOENT|EADDRINUSE|did not respond to HTTP pings|failed to start|container exited|startup probe failed|startup probe succeeded|permission denied|password authentication failed|npm error code [A-Z0-9_]+|JavaScript heap out of memory|segmentation fault|ENOEXEC|health probe timed out|node:internal" "$log" |
            sort | uniq -c || true
