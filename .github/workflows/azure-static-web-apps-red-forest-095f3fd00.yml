name: Deploy HR website to Azure

on:
  push:
    branches: [main]
    paths:
      - 'HR-Pulse-Full-Project/**'
      - '.github/workflows/azure-static-web-apps-red-forest-095f3fd00.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: HR-Pulse-Full-Project/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: HR-Pulse-Full-Project
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: HR-Pulse-Full-Project
        run: pnpm test
      - name: Build frontend
        working-directory: HR-Pulse-Full-Project
        run: |
          pnpm build
          printf '{"commit":"%s","host":"azure-static-web-apps"}\n' "$GITHUB_SHA" > dist/release.json
      - name: Deploy production website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_FOREST_095F3FD00 }}
          action: upload
          app_location: HR-Pulse-Full-Project/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
