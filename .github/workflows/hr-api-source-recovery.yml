name: Publish HR API source recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-api-source-recovery.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: hr-api-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C37CE79234A847D19AFDD5701BFE3EA7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9846DF1DEBB0406BB6F6FF1E2C39D1BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BF09CD4DD2E4E12A4E95F35F288B3F2 }}
      - name: Publish trial joining API files and verify startup
        working-directory: HR-Pulse-Full-Project/server
        run: |
          set -euo pipefail
          app=hr-api-cmll-783
          app_id=$(az resource list --name "$app" --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)
          test -n "$app_id"
          token=$(az account get-access-token --query accessToken -o tsv)
          scm="https://$app.scm.azurewebsites.net/api/vfs/site/wwwroot"
          api="https://$app.azurewebsites.net/api"
          backup=$(mktemp -d)
          for file in app.mjs service.mjs trial-joining.mjs index.mjs release.json; do
            curl -fsS --max-time 15 -H "Authorization: Bearer $token" "$scm/$file" -o "$backup/$file"
          done
          jq -e '.commit == "5545776ecfa69a5ba9c52b06c4a5dc20400f8f65"' "$backup/release.json" > /dev/null
          curl -fsS --max-time 8 "$api/ready" | jq -e '.database == "connected"' > /dev/null
          upload() {
            curl -fsS --max-time 20 -o /dev/null -X PUT -H "Authorization: Bearer $token" -H 'If-Match: *' --data-binary "@$1" "$scm/$2"
          }
          restore() {
            trap - ERR
            echo 'Restoring the last working API files.'
            for file in app.mjs service.mjs trial-joining.mjs index.mjs release.json; do
              upload "$backup/$file" "$file"
            done
            az webapp restart --ids "$app_id"
          }
          trap restore ERR
          printf '{"commit":"%s","host":"azure-app-service"}\n' "$GITHUB_SHA" > release.json
          for file in trial-joining.mjs service.mjs app.mjs index.mjs release.json; do
            upload "$file" "$file"
            curl -fsS --max-time 15 -H "Authorization: Bearer $token" "$scm/$file" | cmp "$file" -
          done
          if ! curl -fsS --max-time 5 "$api/health" | jq -e --arg release "$GITHUB_SHA" '.release == $release' > /dev/null; then
            az webapp restart --ids "$app_id"
          fi
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 6 "$api/health" | jq -e --arg release "$GITHUB_SHA" '.release == $release' > /dev/null; then
              status=$(curl -sS --max-time 6 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$api/import/trial-employee")
              if [ "$status" = '401' ]; then
                curl -fsS --max-time 6 "$api/ready" | jq -e '.database == "connected"' > /dev/null
                echo "Trial joining API is live at $GITHUB_SHA."
                trap - ERR
                exit 0
              fi
            fi
            sleep 5
          done
          trap - ERR
          restore
          exit 1
